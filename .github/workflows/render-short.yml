name: Render Lerry Shorts Factory

on:
  workflow_dispatch:
    inputs:
      production_json:
        description: "Paket produksi JSON dari dashboard (maks. 60 KB)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project, TTS and FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libespeak-ng1
          python -m pip install --upgrade pip
          python -m pip install edge-tts piper-tts
          npm install
          command -v edge-tts
          command -v piper
          command -v ffmpeg
      - name: Download Indonesian Piper fallback voice
        run: |
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/id/id_ID/news_tts/medium"
          mkdir -p .cache/piper
          curl --retry 3 --retry-delay 2 -fL "$BASE/id_ID-news_tts-medium.onnx" -o .cache/piper/id_ID-news_tts-medium.onnx
          curl --retry 3 --retry-delay 2 -fL "$BASE/id_ID-news_tts-medium.onnx.json" -o .cache/piper/id_ID-news_tts-medium.onnx.json
          test -s .cache/piper/id_ID-news_tts-medium.onnx
          test -s .cache/piper/id_ID-news_tts-medium.onnx.json
      - name: Validate owner story and Shorts package
        env:
          PRODUCTION_JSON: ${{ inputs.production_json }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(process.env.PRODUCTION_JSON);
          if(!p.ownerStory||p.script!==p.ownerStory) throw new Error('Cerita owner tidak cocok persis.');
          if(p.script.trim().length<40) throw new Error('Cerita owner terlalu pendek.');
          if(!Array.isArray(p.scenes)||p.scenes.length<4||p.scenes.length>10) throw new Error('Storyboard harus 4-10 adegan.');
          let total=0;
          for(const [i,s] of p.scenes.entries()){
            const seconds=Number(s.seconds);
            if(!Number.isFinite(seconds)||seconds<=0) throw new Error('Durasi adegan '+(i+1)+' tidak valid.');
            total+=seconds;
            if(typeof s.imagePrompt!=='string'||s.imagePrompt.trim().length<20) throw new Error('Prompt visual adegan '+(i+1)+' kurang jelas.');
            for(const field of ['narration','dialogue','subtitle']){
              const line=typeof s[field]==='string'?s[field].trim():'';
              if(line&&!p.ownerStory.includes(line)) throw new Error('Teks '+field+' adegan '+(i+1)+' bukan kutipan asli.');
            }
          }
          if(total<15||total>60) throw new Error('Durasi Shorts harus 15-60 detik.');
          if(!p.scenes.some(s=>String(s.narration||s.dialogue||'').trim())) throw new Error('Narasi/dialog kosong.');
          fs.mkdirSync('public',{recursive:true});
          fs.writeFileSync('production.json',JSON.stringify(p,null,2));
          console.log('PACKAGE QC PASS',{scenes:p.scenes.length,total,ownerStoryExact:true});
          NODE
      - name: Generate Indonesian narration with Edge TTS and Piper fallback
        env:
          PRODUCTION_JSON: ${{ inputs.production_json }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const p=JSON.parse(process.env.PRODUCTION_JSON);
          const model='.cache/piper/id_ID-news_tts-medium.onnx';
          const run=(cmd,args,opts={})=>cp.spawnSync(cmd,args,{encoding:'utf8',...opts});
          const fail=(label,r)=>{throw new Error(label+': '+(r.error?.message||r.stderr||r.stdout||r.status));};
          for(let i=0;i<p.scenes.length;i++){
            const scene=p.scenes[i];
            const spoken=[scene.narration,scene.dialogue].filter(Boolean).join('. ').trim();
            if(!spoken){scene.voiceFile=undefined;scene.voiceDurationSeconds=0;continue;}
            const stem='scene-'+String(i+1).padStart(2,'0');
            const mp3='/tmp/'+stem+'.mp3';
            const wav='public/'+stem+'.wav';
            let engine='edge-tts';
            const edge=run('edge-tts',['--voice','id-ID-ArdiNeural','--rate=+0%','--text',spoken,'--write-media',mp3]);
            if(edge.status===0&&fs.existsSync(mp3)&&fs.statSync(mp3).size>1000){
              const convert=run('ffmpeg',['-y','-v','error','-i',mp3,'-ac','1','-ar','24000',wav]);
              if(convert.status!==0) fail('Konversi Edge TTS adegan '+(i+1),convert);
            }else{
              console.warn('EDGE TTS FAILED; switching to Piper for scene '+(i+1),edge.stderr||edge.error?.message||'no output');
              engine='piper-tts';
              const piper=run('piper',['--model',model,'--output_file',wav],{input:spoken});
              if(piper.status!==0) fail('Edge dan Piper gagal pada adegan '+(i+1),piper);
            }
            if(!fs.existsSync(wav)||fs.statSync(wav).size<1000) throw new Error('Audio kosong/tidak valid pada adegan '+(i+1));
            const probe=run('ffprobe',['-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',wav]);
            if(probe.status!==0) fail('FFprobe adegan '+(i+1),probe);
            const duration=Number(probe.stdout.trim());
            if(!Number.isFinite(duration)||duration<=0) throw new Error('Durasi audio tidak valid pada adegan '+(i+1));
            scene.voiceFile=stem+'.wav';
            scene.voiceDurationSeconds=duration;
            console.log('SCENE TTS PASS',{scene:i+1,engine,file:scene.voiceFile,seconds:Number(duration.toFixed(2)),bytes:fs.statSync(wav).size});
          }
          fs.writeFileSync('production.json',JSON.stringify(p,null,2));
          console.log('PER-SCENE AUDIO READY; Edge primary, Piper fallback.');
          NODE
      - name: Render MP4 vertical 1080x1920
        run: npx remotion render src/remotion/index.ts LerryShort out/lerry-animasi-short.mp4 --props=production.json --codec=h264 --crf=20
      - name: Verify MP4, video and narration
        run: |
          test -s out/lerry-animasi-short.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/lerry-animasi-short.mp4 > out/mp4-metadata.json
          node <<'NODE'
          const fs=require('fs');
          const meta=JSON.parse(fs.readFileSync('out/mp4-metadata.json','utf8'));
          const video=meta.streams.find(s=>s.codec_type==='video');
          const audio=meta.streams.find(s=>s.codec_type==='audio');
          if(!video||video.codec_name!=='h264'||video.width!==1080||video.height!==1920) throw new Error('Format video tidak sesuai 1080x1920 H.264.');
          const [n,d]=video.r_frame_rate.split('/').map(Number);
          if(n/d!==30) throw new Error('Frame rate bukan 30 fps.');
          if(!audio) throw new Error('Audio narasi tidak ditemukan.');
          const duration=Number(meta.format.duration);
          if(duration<15||duration>60) throw new Error('Durasi Shorts di luar 15-60 detik.');
          console.log('SHORTS MP4 PASS',{width:video.width,height:video.height,fps:n/d,duration,audio:true});
          NODE
          ffmpeg -v error -i out/lerry-animasi-short.mp4 -f null -
      - name: Upload finished Shorts
        uses: actions/upload-artifact@v4
        with:
          name: lerry-animasi-short
          path: out/lerry-animasi-short.mp4
          if-no-files-found: error
          retention-days: 7
