name: Render Lerry Shorts Factory

on:
  workflow_dispatch:
    inputs:
      production_json:
        description: "Paket produksi yang sudah diperiksa owner (maks. 60 KB)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project, TTS and FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libespeak-ng1 fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install requests edge-tts piper-tts
          npm install
          command -v edge-tts
          command -v piper
          command -v ffmpeg
      - name: Download Indonesian Piper fallback voice
        run: |
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/id/id_ID/news_tts/medium"
          mkdir -p .cache/piper
          curl --retry 3 --retry-delay 2 -fL "$BASE/id_ID-news_tts-medium.onnx" -o .cache/piper/id_ID-news_tts-medium.onnx || true
          curl --retry 3 --retry-delay 2 -fL "$BASE/id_ID-news_tts-medium.onnx.json" -o .cache/piper/id_ID-news_tts-medium.onnx.json || true
          if test -s .cache/piper/id_ID-news_tts-medium.onnx && test -s .cache/piper/id_ID-news_tts-medium.onnx.json; then
            echo "PIPER_FALLBACK_READY"
          else
            echo "::warning::Piper fallback download unavailable; Edge TTS remains primary."
          fi
      - name: Validate owner-approved package
        env:
          PRODUCTION_JSON: ${{ inputs.production_json }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(process.env.PRODUCTION_JSON);
          if(!p.ownerStory||p.script!==p.ownerStory) throw new Error('Cerita hasil AI tidak cocok dengan naskah produksi.');
          if(p.script.trim().length<80) throw new Error('Cerita terlalu pendek.');
          if(!Array.isArray(p.scenes)||p.scenes.length<4||p.scenes.length>6) throw new Error('Storyboard harus 4-6 adegan.');
          let total=0;
          for(const [i,s] of p.scenes.entries()){
            const seconds=Number(s.seconds);
            if(!Number.isInteger(seconds)||seconds<4||seconds>12) throw new Error('Durasi adegan '+(i+1)+' tidak valid.');
            total+=seconds;
            if(typeof s.imagePrompt!=='string'||s.imagePrompt.trim().length<25) throw new Error('Prompt visual adegan '+(i+1)+' kurang jelas.');
            if(!String(s.subtitle||'').trim()) throw new Error('Subtitle adegan '+(i+1)+' kosong.');
            if(!['idle','walk','run','surprised','point'].includes(s.action)) throw new Error('Aksi karakter adegan '+(i+1)+' tidak valid.');
            if(!String(s.narration||s.dialogue||'').trim()) throw new Error('Narasi/dialog adegan '+(i+1)+' kosong.');
          }
          if(total<20||total>60) throw new Error('Durasi Shorts harus 20-60 detik.');
          fs.mkdirSync('public',{recursive:true});
          fs.writeFileSync('production.json',JSON.stringify(p,null,2));
          console.log('OWNER-APPROVED PACKAGE QC PASS',{scenes:p.scenes.length,total});
          NODE
      - name: Generate Indonesian narration with Edge TTS and Piper fallback
        env:
          PRODUCTION_JSON: ${{ inputs.production_json }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const p=JSON.parse(process.env.PRODUCTION_JSON);
          const model='.cache/piper/id_ID-news_tts-medium.onnx';
          const run=(cmd,args,opts={})=>cp.spawnSync(cmd,args,{encoding:'utf8',...opts});
          const fail=(label,r)=>{throw new Error(label+': '+(r.error?.message||r.stderr||r.stdout||r.status));};
          for(let i=0;i<p.scenes.length;i++){
            const scene=p.scenes[i];
            const spoken=[scene.narration,scene.dialogue].filter(Boolean).join('. ').trim();
            if(!spoken){scene.voiceFile=undefined;scene.voiceDurationSeconds=0;continue;}
            const stem='scene-'+String(i+1).padStart(2,'0');
            const mp3='/tmp/'+stem+'.mp3';
            const wav='public/'+stem+'.wav';
            let engine='edge-tts';
            const edge=run('edge-tts',['--voice','id-ID-ArdiNeural','--rate=+0%','--text',spoken,'--write-media',mp3]);
            let edgeReady=edge.status===0&&fs.existsSync(mp3)&&fs.statSync(mp3).size>1000;
            if(edgeReady){
              const convert=run('ffmpeg',['-y','-v','error','-i',mp3,'-ac','1','-ar','24000',wav]);
              edgeReady=convert.status===0&&fs.existsSync(wav)&&fs.statSync(wav).size>1000;
              if(!edgeReady) console.warn('EDGE AUDIO CONVERSION FAILED; switching to Piper for scene '+(i+1),convert.stderr||convert.error?.message||'invalid WAV output');
            }else console.warn('EDGE TTS FAILED; switching to Piper for scene '+(i+1),edge.stderr||edge.error?.message||'no output');
            if(!edgeReady){
              engine='piper-tts';
              try{fs.rmSync(wav,{force:true});}catch{}
              if(!fs.existsSync(model)||!fs.existsSync(model+'.json')) throw new Error('Edge TTS gagal dan model Piper fallback tidak tersedia pada runner.');
              const piper=run('piper',['--model',model,'--output_file',wav],{input:spoken});
              if(piper.status!==0) fail('Edge dan Piper gagal pada adegan '+(i+1),piper);
            }
            if(!fs.existsSync(wav)||fs.statSync(wav).size<1000) throw new Error('Audio kosong/tidak valid pada adegan '+(i+1));
            const probe=run('ffprobe',['-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',wav]);
            if(probe.status!==0) fail('FFprobe adegan '+(i+1),probe);
            const duration=Number(probe.stdout.trim());
            if(!Number.isFinite(duration)||duration<=0) throw new Error('Durasi audio tidak valid pada adegan '+(i+1));
            scene.voiceFile=stem+'.wav';scene.voiceDurationSeconds=duration;
            scene.seconds=Math.max(Number(scene.seconds)||1,Math.ceil(duration+0.2));
            console.log('SCENE TTS PASS',{scene:i+1,engine,file:scene.voiceFile,seconds:Number(duration.toFixed(2)),sceneSeconds:scene.seconds,bytes:fs.statSync(wav).size});
          }
          const finalDuration=p.scenes.reduce((sum,scene)=>sum+Number(scene.seconds||0),0);
          if(finalDuration<20||finalDuration>60) throw new Error('Durasi setelah menyesuaikan audio harus tetap 20-60 detik; revisi storyboard sebelum render.');
          p.durationSeconds=finalDuration;
          fs.writeFileSync('production.json',JSON.stringify(p,null,2));
          NODE
      - name: Render AI-directed scenes with local Remotion engine
        run: |
          mkdir -p out
          npx remotion render src/remotion/index.ts LerryShort out/lerry-animasi-short.mp4 --codec=h264 --crf=20 --props=production.json
          test -s out/lerry-animasi-short.mp4
      - name: Verify MP4, video and narration
        run: |
          test -s out/lerry-animasi-short.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration -of json out/lerry-animasi-short.mp4 > out/mp4-metadata.json
          node <<'NODE'
          const fs=require('fs');
          const meta=JSON.parse(fs.readFileSync('out/mp4-metadata.json','utf8'));
          const video=meta.streams.find(s=>s.codec_type==='video');
          const audio=meta.streams.find(s=>s.codec_type==='audio');
          if(!video||video.codec_name!=='h264'||video.width!==1080||video.height!==1920) throw new Error('Format video tidak sesuai 1080x1920 H.264.');
          const [n,d]=video.r_frame_rate.split('/').map(Number);
          if(n/d!==30) throw new Error('Frame rate bukan 30 fps.');
          if(!audio||audio.codec_name!=='aac') throw new Error('Audio narasi AAC tidak ditemukan.');
          if(video.pix_fmt!=='yuv420p') throw new Error('Pixel format harus yuv420p agar kompatibel luas.');
          const duration=Number(meta.format.duration);
          if(duration<15||duration>60) throw new Error('Durasi Shorts di luar 15-60 detik.');
          console.log('SHORTS MP4 PASS',{width:video.width,height:video.height,fps:n/d,duration,audio:true});
          NODE
          ffmpeg -v error -i out/lerry-animasi-short.mp4 -f null -
      - name: Capture representative frames and build visual contact sheet
        run: |
          mkdir -p out/qc
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const p=JSON.parse(fs.readFileSync('production.json','utf8'));
          let cursor=0;
          for(let i=0;i<p.scenes.length;i++){
            const seconds=Number(p.scenes[i].seconds)||1;
            const at=cursor+Math.min(seconds/2,Math.max(0,seconds-0.25));
            const out='out/qc/scene-'+String(i+1).padStart(2,'0')+'-mid.png';
            const r=cp.spawnSync('ffmpeg',['-y','-v','error','-ss',String(at),'-i','out/lerry-animasi-short.mp4','-frames:v','1','-vf','scale=270:480',out],{encoding:'utf8'});
            if(r.status!==0||!fs.existsSync(out)||fs.statSync(out).size<1000) throw new Error('Frame QC gagal pada adegan '+(i+1)+': '+(r.stderr||r.error?.message||r.status));
            cursor+=seconds;
          }
          NODE
          ffmpeg -y -v error -pattern_type glob -i 'out/qc/scene-*-mid.png' -vf "tile=3x2:padding=12:margin=12:color=white" -frames:v 1 out/qc/contact-sheet.jpg
          test -s out/qc/contact-sheet.jpg
      - name: Prepare upload-ready thumbnail and YouTube metadata
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('production.json','utf8'));
          const tags=(p.hashtags||[]).map(x=>String(x).replace(/^#/,'').trim()).filter(Boolean);
          fs.writeFileSync('out/youtube-metadata.json',JSON.stringify({
            title:p.title||p.workingTitle,
            description:p.description||'',
            tags,
            hashtags:(p.hashtags||[]),
            category:'Education',
            language:'id',
            aspectRatio:'9:16',
            visibility:'private'
          },null,2));
          const words=String(p.title||p.workingTitle||'LERRY ANIMASI').trim().split(/\s+/);
          const lines=[];let line='';
          for(const word of words){const next=(line+' '+word).trim();if(next.length>22&&line){lines.push(line);line=word;}else line=next;}
          if(line)lines.push(line);
          fs.writeFileSync('out/thumbnail-title.txt',lines.slice(0,3).join('\n'));
          NODE
          ffmpeg -y -v error -ss 2 -i out/lerry-animasi-short.mp4 -frames:v 1 -vf "drawbox=x=36:y=ih*0.68:w=iw-72:h=ih*0.27:color=black@0.58:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=out/thumbnail-title.txt:fontcolor=white:fontsize=64:line_spacing=16:x=(w-text_w)/2:y=h*0.73" -q:v 2 out/thumbnail.jpg
          test -s out/thumbnail.jpg
          test -s out/youtube-metadata.json
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 out/thumbnail.jpg | grep -qx '1080x1920'
      - name: Write production QC report
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('production.json','utf8'));
          const meta=JSON.parse(fs.readFileSync('out/mp4-metadata.json','utf8'));
          const video=meta.streams.find(s=>s.codec_type==='video');
          const audio=meta.streams.find(s=>s.codec_type==='audio');
          const report={
            status:'PASS',
            pipeline:'owner-approved-package -> Edge TTS/Piper -> Remotion -> FFmpeg -> MP4 QC',
            generatedAt:new Date().toISOString(),
            story:{title:p.workingTitle,characters:p.ownerStory.length,scenes:p.scenes.length},
            output:{file:'lerry-animasi-short.mp4',bytes:fs.statSync('out/lerry-animasi-short.mp4').size,durationSeconds:Number(meta.format.duration),width:video.width,height:video.height,fps:(()=>{const [n,d]=video.r_frame_rate.split('/').map(Number);return n/d;})(),videoCodec:video.codec_name,pixelFormat:video.pix_fmt,audioCodec:audio.codec_name},
            checks:{
              ownerStoryPreserved:p.script===p.ownerStory,
              allScenesNarrated:p.scenes.every(s=>String(s.narration||s.dialogue||'').trim().length>0),
              allScenesHaveSubtitles:p.scenes.every(s=>String(s.subtitle||'').trim().length>0),
              allScenesHaveVisualDirections:p.scenes.every(s=>String(s.imagePrompt||'').trim().length>=25),
              allSceneAudioExists:p.scenes.every(s=>s.voiceFile&&fs.existsSync('public/'+s.voiceFile)),
              mp4DecodePassed:true,
              representativeFramesCaptured:fs.readdirSync('out/qc').filter(f=>f.endsWith('-mid.png')).length===p.scenes.length,
              contactSheetExists:fs.existsSync('out/qc/contact-sheet.jpg'),
              thumbnailExists:fs.existsSync('out/thumbnail.jpg'),
              youtubeMetadataExists:fs.existsSync('out/youtube-metadata.json')
            },
            limitations:['QC ini memeriksa struktur, file, codec, decode dan frame representatif; pemeriksaan artistik subjektif tetap perlu ditinjau owner.','Visual adegan menggunakan komposisi vektor 2D yang tersedia; bukan gambar AI khusus per adegan.','Fakta eksternal tidak diverifikasi otomatis.']
          };
          if(Object.values(report.checks).some(v=>v!==true)) throw new Error('Production QC report contains failed checks: '+JSON.stringify(report.checks));
          fs.writeFileSync('out/production-qc.json',JSON.stringify(report,null,2));
          console.log('PRODUCTION QC PASS',JSON.stringify(report,null,2));
          NODE
      - name: Upload finished Shorts
        uses: actions/upload-artifact@v4
        with:
          name: lerry-animasi-short
          path: |
            out/lerry-animasi-short.mp4
            out/thumbnail.jpg
            out/youtube-metadata.json
            out/production-qc.json
            out/mp4-metadata.json
            out/qc/**
          if-no-files-found: error
          retention-days: 7
