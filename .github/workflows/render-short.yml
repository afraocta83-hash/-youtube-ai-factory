name: Render Lerry Shorts Factory

on:
  workflow_dispatch:
    inputs:
      production_json:
        description: "Tempel JSON paket produksi dari dashboard (maks. 60 KB)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate story and Shorts package
        env:
          PRODUCTION_JSON: ${{ inputs.production_json }}
          QC_URL: https://youtube-ai-factory-afraocta83-9700.vercel.app/api/quality-check
        run: |
          node <<'NODE'
          (async () => {
          const fs = require('fs');
          const p = JSON.parse(process.env.PRODUCTION_JSON);
          if (!Array.isArray(p.scenes) || p.scenes.length < 4 || p.scenes.length > 10) throw new Error('Storyboard harus 4-10 adegan.');
          const seconds = p.scenes.reduce((n,s) => n + Number(s.seconds || 0), 0);
          if (seconds < 15 || seconds > 60) throw new Error('Durasi wajib 15-60 detik.');
          if (!p.script || p.script.length < 40) throw new Error('Cerita asli owner wajib disertakan.');
          if (!p.ownerStory || p.script !== p.ownerStory) throw new Error('Naskah tidak cocok persis dengan cerita asli owner. Produksi dihentikan.');
          const qc = await fetch(process.env.QC_URL, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...p, ownerStory:p.ownerStory})});
          const q = await qc.json();
          if (!qc.ok || !q.passed) throw new Error('QC gagal: ' + JSON.stringify(q.issues || q));
          fs.mkdirSync('public', {recursive:true});
          p.voiceFile = 'voice.wav';
          fs.writeFileSync('production.json', JSON.stringify(p, null, 2));
          console.log('QC PASS', q.score, 'Durasi', seconds, 'detik');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Generate Indonesian narration with Gemini TTS
        env:
          PRODUCTION_JSON: ${{ inputs.production_json }}
          VOICE_URL: https://youtube-ai-factory-afraocta83-9700.vercel.app/api/voice
        run: |
          node <<'NODE'
          (async () => {
          const fs = require('fs');
          const p = JSON.parse(process.env.PRODUCTION_JSON);
          const spoken = p.scenes.map(s => [s.narration, s.dialogue].filter(Boolean).join('. ')).filter(Boolean).join('\n');
          if (!spoken.trim()) throw new Error('Narasi/dialog kosong. Isi audio script dari cerita owner terlebih dahulu.');
          if (spoken.length > 8000) throw new Error('Teks suara lebih dari 8.000 karakter.');
          const r = await fetch(process.env.VOICE_URL, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:spoken,voiceName:'Kore',style:'Narator kartun Shorts Indonesia, ekspresif, jelas, tempo hidup, artikulasi bersih.'})});
          const data = await r.json();
          if (!r.ok || !data.audioBase64) throw new Error('Gemini TTS gagal: ' + (data.error || r.status));
          fs.writeFileSync('public/voice.wav', Buffer.from(data.audioBase64,'base64'));
          console.log('Audio narasi berhasil dibuat.');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Render MP4 vertical 1080x1920
        run: npx remotion render src/remotion/index.ts LerryShort out/lerry-animasi-short.mp4 --props=production.json --codec=h264 --crf=20
      - name: Verify MP4 output
        run: |
          test -s out/lerry-animasi-short.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/lerry-animasi-short.mp4 > out/mp4-metadata.json
          node <<'NODE'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('out/mp4-metadata.json', 'utf8'));
          const video = meta.streams.find((stream) => stream.codec_type === 'video');
          const audio = meta.streams.find((stream) => stream.codec_type === 'audio');
          if (!video || video.codec_name !== 'h264') throw new Error('Video H.264 tidak ditemukan.');
          if (video.width !== 1080 || video.height !== 1920) throw new Error('Resolusi harus 1080x1920 (9:16).');
          const [num, den] = video.r_frame_rate.split('/').map(Number);
          if (num / den !== 30) throw new Error('Frame rate harus 30 fps.');
          if (!audio) throw new Error('Audio narration track tidak ditemukan.');
          const duration = Number(meta.format.duration);
          if (duration < 15 || duration > 60) throw new Error('Durasi harus 15-60 detik.');
          console.log('SHORTS MP4 PASS', {codec: video.codec_name, width: video.width, height: video.height, fps: num / den, duration, audio: true});
          NODE
          ffmpeg -v error -i out/lerry-animasi-short.mp4 -f null -
      - name: Upload finished Shorts
        uses: actions/upload-artifact@v4
        with:
          name: lerry-animasi-short
          path: out/lerry-animasi-short.mp4
          if-no-files-found: error
          retention-days: 7
