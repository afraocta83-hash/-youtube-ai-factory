name: Render Lerry Shorts Factory

on:
  workflow_dispatch:
    inputs:
      production_json:
        description: "Paket produksi JSON dari dashboard (maks. 60 KB)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate owner story and Shorts package
        env:
          PRODUCTION_JSON: ${{ inputs.production_json }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(process.env.PRODUCTION_JSON);
          if(!p.ownerStory||p.script!==p.ownerStory) throw new Error('Cerita owner tidak cocok persis.');
          if(p.script.trim().length<40) throw new Error('Cerita owner terlalu pendek.');
          if(!Array.isArray(p.scenes)||p.scenes.length<4||p.scenes.length>10) throw new Error('Storyboard harus 4-10 adegan.');
          let total=0;
          for(const [i,s] of p.scenes.entries()){
            const seconds=Number(s.seconds);
            if(!Number.isFinite(seconds)||seconds<=0) throw new Error('Durasi adegan '+(i+1)+' tidak valid.');
            total+=seconds;
            if(typeof s.imagePrompt!=='string'||s.imagePrompt.trim().length<20) throw new Error('Prompt visual adegan '+(i+1)+' kurang jelas.');
            for(const field of ['narration','dialogue','subtitle']){
              const line=typeof s[field]==='string'?s[field].trim():'';
              if(line&&!p.ownerStory.includes(line)) throw new Error('Teks '+field+' adegan '+(i+1)+' bukan kutipan asli.');
            }
          }
          if(total<15||total>60) throw new Error('Durasi Shorts harus 15-60 detik.');
          if(!p.scenes.some(s=>String(s.narration||s.dialogue||'').trim())) throw new Error('Narasi/dialog kosong.');
          fs.mkdirSync('public',{recursive:true});
          fs.writeFileSync('production.json',JSON.stringify(p,null,2));
          console.log('PACKAGE QC PASS',{scenes:p.scenes.length,total,ownerStoryExact:true});
          NODE
      - name: Generate per-scene Indonesian narration and subtitle timing
        env:
          PRODUCTION_JSON: ${{ inputs.production_json }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
        run: |
          node <<'NODE'
          (async()=>{
            const fs=require('fs');
            const p=JSON.parse(process.env.PRODUCTION_JSON);
            const key=process.env.GEMINI_API_KEY;
            if(!key) throw new Error('GEMINI_API_KEY belum diset di GitHub Actions.');
            const model=process.env.GEMINI_TTS_MODEL||'gemini-3.8-flash-tts';
            for(let i=0;i<p.scenes.length;i++){
              const scene=p.scenes[i];
              const spoken=[scene.narration,scene.dialogue].filter(Boolean).join('. ').trim();
              if(!spoken){scene.voiceFile=undefined;scene.voiceDurationSeconds=0;continue;}
              const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key);
              let response,data;
              for(let attempt=0;attempt<4;attempt++){
                response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
                  contents:[{parts:[{text:spoken,speechMetadata:{style:'Narator kartun Shorts Bahasa Indonesia, ekspresif, hangat, jelas dan natural.'}}]}],
                  generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:'Kore'}}}}
                }),signal:AbortSignal.timeout(55000)});
                data=await response.json();
                if(response.ok) break;
                if(response.status!==429||attempt===3) throw new Error('Gemini TTS adegan '+(i+1)+' gagal: '+(data.error?.message||response.status));
                await new Promise(r=>setTimeout(r,2500*(attempt+1)));
              }
              const part=data?.candidates?.[0]?.content?.parts?.find(x=>x.inlineData?.data);
              if(!part) throw new Error('Audio adegan '+(i+1)+' kosong.');
              const raw=Buffer.from(part.inlineData.data,'base64');
              const mime=part.inlineData.mimeType||'audio/pcm;rate=24000';
              let audio=raw;
              if(!mime.includes('wav')){
                const rate=Number((mime.match(/rate=(\\d+)/)||[])[1]||24000);
                const header=Buffer.alloc(44);
                header.write('RIFF',0);header.writeUInt32LE(36+raw.length,4);header.write('WAVE',8);
                header.write('fmt ',12);header.writeUInt32LE(16,16);header.writeUInt16LE(1,20);
                header.writeUInt16LE(1,22);header.writeUInt32LE(rate,24);header.writeUInt32LE(rate*2,28);
                header.writeUInt16LE(2,32);header.writeUInt16LE(16,34);header.write('data',36);header.writeUInt32LE(raw.length,40);
                audio=Buffer.concat([header,raw]);
                scene.voiceDurationSeconds=raw.length/(2*rate);
              }else{
                scene.voiceDurationSeconds=Math.max(0.1,(audio.length-44)/48000);
              }
              const file='scene-'+String(i+1).padStart(2,'0')+'.wav';
              fs.writeFileSync('public/'+file,audio);
              scene.voiceFile=file;
              console.log('SCENE TTS PASS',{scene:i+1,file,seconds:Number(scene.voiceDurationSeconds.toFixed(2)),bytes:audio.length});
              await new Promise(r=>setTimeout(r,700));
            }
            fs.writeFileSync('production.json',JSON.stringify(p,null,2));
            console.log('PER-SCENE AUDIO READY');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Render MP4 vertical 1080x1920
        run: npx remotion render src/remotion/index.ts LerryShort out/lerry-animasi-short.mp4 --props=production.json --codec=h264 --crf=20
      - name: Install FFmpeg verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffprobe
      - name: Verify MP4, video and narration
        run: |
          test -s out/lerry-animasi-short.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/lerry-animasi-short.mp4 > out/mp4-metadata.json
          node <<'NODE'
          const fs=require('fs');
          const meta=JSON.parse(fs.readFileSync('out/mp4-metadata.json','utf8'));
          const video=meta.streams.find(s=>s.codec_type==='video');
          const audio=meta.streams.find(s=>s.codec_type==='audio');
          if(!video||video.codec_name!=='h264'||video.width!==1080||video.height!==1920) throw new Error('Format video tidak sesuai 1080x1920 H.264.');
          const [n,d]=video.r_frame_rate.split('/').map(Number);
          if(n/d!==30) throw new Error('Frame rate bukan 30 fps.');
          if(!audio) throw new Error('Audio narasi tidak ditemukan.');
          const duration=Number(meta.format.duration);
          if(duration<15||duration>60) throw new Error('Durasi Shorts di luar 15-60 detik.');
          console.log('SHORTS MP4 PASS',{width:video.width,height:video.height,fps:n/d,duration,audio:true});
          NODE
          ffmpeg -v error -i out/lerry-animasi-short.mp4 -f null -
      - name: Upload finished Shorts
        uses: actions/upload-artifact@v4
        with:
          name: lerry-animasi-short
          path: out/lerry-animasi-short.mp4
          if-no-files-found: error
          retention-days: 7
