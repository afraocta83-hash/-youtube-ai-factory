name: Lerry OpenMontage Motion Experiment

on:
  push:
    branches:
      - experiment/openmontage-video-engine
    paths:
      - "src/remotion/**"
      - "app/api/**"
      - "app/studio.tsx"
      - ".github/workflows/render-short.yml"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/openmontage-motion-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-motion-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Next.js application
        run: npm run build
      - name: Verify Remotion compositions
        run: npx remotion compositions src/remotion/index.ts
      - name: Render five-action showcase
        run: |
          mkdir -p out
          npx remotion render src/remotion/index.ts SceneMotionShowcase out/openmontage-motion-showcase.mp4 --codec=h264 --crf=23
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffprobe
      - name: Verify MP4
        run: |
          test -s out/openmontage-motion-showcase.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/openmontage-motion-showcase.mp4 > out/mp4-metadata.json
          node <<'NODE'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('out/mp4-metadata.json', 'utf8'));
          const video = meta.streams.find((stream) => stream.codec_type === 'video');
          if (!video) throw new Error('Video stream tidak ditemukan.');
          if (video.codec_name !== 'h264') throw new Error('Codec harus H.264.');
          if (video.width !== 1080 || video.height !== 1920) throw new Error('Resolusi harus 1080x1920 (9:16).');
          const [num, den] = video.r_frame_rate.split('/').map(Number);
          if (num / den !== 30) throw new Error('Frame rate harus 30 fps.');
          const duration = Number(meta.format.duration);
          if (duration < 15 || duration > 60) throw new Error('Durasi harus 15-60 detik.');
          console.log('MP4 PASS', {codec: video.codec_name, width: video.width, height: video.height, fps: num / den, duration});
          NODE
          ffmpeg -v error -i out/openmontage-motion-showcase.mp4 -f null -
      - name: Upload experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: lerry-openmontage-motion-showcase
          path: out/openmontage-motion-showcase.mp4
          if-no-files-found: error
          retention-days: 7
