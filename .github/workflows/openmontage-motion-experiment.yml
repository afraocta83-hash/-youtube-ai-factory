name: Lerry OpenMontage Motion Experiment

on:
  push:
    branches:
      - experiment/openmontage-video-engine
    paths:
      - "src/remotion/**"
      - "app/api/**"
      - "app/studio.tsx"
      - ".github/workflows/render-short.yml"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/openmontage-motion-experiment.yml"
  workflow_dispatch:

concurrency:
  group: lerry-motion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-motion-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: |
          npm audit --audit-level=moderate
          npm ls next postcss
      - name: Check Gemini TTS secret availability
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is configured (value hidden)."
          else
            echo "::error::GEMINI_API_KEY is required for the live TTS smoke test."
            exit 1
          fi
      - name: Generate a real Gemini TTS smoke sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
        run: |
          mkdir -p out
          node <<'NODE'
          (async () => {
            const fs = require('node:fs');
            const key = process.env.GEMINI_API_KEY;
            if (!key) throw new Error('GEMINI_API_KEY missing.');
            const model = process.env.GEMINI_TTS_MODEL;
            const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key);
            const response = await fetch(url, {
              method: 'POST',
              headers: {'content-type':'application/json'},
              body: JSON.stringify({
                contents: [{parts:[{text:'Halo, ini tes suara Lerry Animasi.',speechMetadata:{style:'Say in Indonesian with a clear, friendly cartoon narrator voice.'}}]}],
                generationConfig: {
                  responseModalities: ['AUDIO'],
                  speechConfig: {voiceConfig:{prebuiltVoiceConfig:{voiceName:'Kore'}}}
                }
              }),
              signal: AbortSignal.timeout(55000)
            });
            const data = await response.json();
            if (!response.ok) throw new Error('Gemini TTS failed: ' + (data.error?.message || response.status));
            const part = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData?.data);
            if (!part) throw new Error('Gemini returned no audio payload.');
            const raw = Buffer.from(part.inlineData.data, 'base64');
            if (raw.length < 1024) throw new Error('Gemini audio payload is unexpectedly small.');
            const mime = part.inlineData.mimeType || 'audio/pcm;rate=24000';
            let audio = raw;
            if (!mime.includes('wav')) {
              const rate = Number((mime.match(/rate=(\\d+)/) || [])[1] || 24000);
              const channels = Number((mime.match(/channels=(\\d+)/) || [])[1] || 1);
              const header = Buffer.alloc(44);
              header.write('RIFF',0); header.writeUInt32LE(36 + raw.length,4); header.write('WAVE',8);
              header.write('fmt ',12); header.writeUInt32LE(16,16); header.writeUInt16LE(1,20);
              header.writeUInt16LE(channels,22); header.writeUInt32LE(rate,24);
              header.writeUInt32LE(rate * channels * 2,28); header.writeUInt16LE(channels * 2,32);
              header.writeUInt16LE(16,34); header.write('data',36); header.writeUInt32LE(raw.length,40);
              audio = Buffer.concat([header, raw]);
            }
            fs.writeFileSync('out/tts-smoke.wav', audio);
            console.log('LIVE GEMINI TTS PASS', {model, mimeType:mime, bytes:audio.length});
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Next.js application
        run: npm run build
      - name: Smoke-test QC and live storyboard generation APIs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm start > /tmp/lerry-next.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat /tmp/lerry-next.log; exit 1; fi
          node <<'NODE'
          const assert = require('node:assert/strict');
          const story = 'Riko menemukan peta di loteng. Ia mengikuti tanda menuju taman. Di bawah pohon, ia menemukan kotak kecil. Riko membuka kotak dan tersenyum.';
          const scenes = [
            'Riko menemukan peta di loteng.',
            'Ia mengikuti tanda menuju taman.',
            'Di bawah pohon, ia menemukan kotak kecil.',
            'Riko membuka kotak dan tersenyum.'
          ].map((line,i)=>({number:i+1,seconds:4,imagePrompt:'Ilustrasi kartun 2D berwarna untuk adegan cerita nomor '+(i+1),narration:line,dialogue:'',subtitle:line}));
          const base = {script:story,ownerStory:story,scenes,title:'Riko dan Peta Rahasia',description:'Uji pipeline Lerry Animasi.',factCheckNotes:['Cerita fiksi untuk smoke test.']};
          async function qc(payload) {
            const response=await fetch('http://127.0.0.1:3000/api/quality-check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
            assert.equal(response.status,200);
            return response.json();
          }
          (async()=>{
            const good=await qc(base);
            assert.equal(good.passed,true,'Valid owner story package should pass QC');
            assert.equal(good.checks.ownerStoryExactMatch,true);
            const changed=await qc({...base,script:story+' Tambahan.'});
            assert.equal(changed.passed,false,'Changed owner story must fail QC');
            const invented={...base,scenes:base.scenes.map((s,i)=>i===0?{...s,subtitle:'Dialog baru yang tidak ada di cerita.'}:s)};
            const inventedResult=await qc(invented);
            assert.equal(inventedResult.passed,false,'Invented subtitle must fail QC');
            const {ownerStory,...withoutOwnerStory}=base;
            const missingOwner=await qc(withoutOwnerStory);
            assert.equal(missingOwner.passed,false,'Missing owner story must fail QC');
            const storyForGeneration='Mira menemukan sebuah kunci tua di halaman rumah. Ia membawa kunci itu ke perpustakaan kecil di ujung jalan. Penjaga perpustakaan menunjukkan sebuah peti kayu di ruang baca. Mira membuka peti itu dan menemukan foto keluarganya.';
            let generatedResponse, generated;
            for(let attempt=0;attempt<3;attempt++){
              generatedResponse=await fetch('http://127.0.0.1:3000/api/produce',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({story:storyForGeneration})});
              generated=await generatedResponse.json();
              if(generatedResponse.status===200 || (generatedResponse.status!==429 && generatedResponse.status<500)) break;
              if(attempt<2) await new Promise(resolve=>setTimeout(resolve,3000*(attempt+1)));
            }
            assert.equal(generatedResponse.status,200,'Live Gemini storyboard API should return HTTP 200: '+JSON.stringify(generated));
            assert.equal(generated.ownerStoryPreserved,true);
            assert.equal(generated.production.ownerStory,storyForGeneration,'Owner story must be preserved byte-for-byte');
            assert.equal(generated.production.script,storyForGeneration,'Canonical script must remain the owner story');
            assert.ok(generated.production.scenes.length>=4 && generated.production.scenes.length<=10);
            const total=generated.production.scenes.reduce((sum,s)=>sum+Number(s.seconds),0);
            assert.ok(total>=15 && total<=60,'Storyboard duration must be 15-60 seconds');
            for(const [i,s] of generated.production.scenes.entries()){
              for(const field of ['narration','dialogue','subtitle']){
                const line=typeof s[field]==='string'?s[field].trim():'';
                assert.ok(!line || storyForGeneration.includes(line),'Generated '+field+' in scene '+(i+1)+' must be an exact excerpt');
              }
            }
            console.log('LIVE STORYBOARD API PASS',{model:generated.model,scenes:generated.production.scenes.length,durationSeconds:total,ownerStoryExact:true});
            console.log('QC API PASS: valid package accepted; changed story, missing owner story and invented subtitle rejected.');
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Verify Remotion compositions
        run: npx remotion compositions src/remotion/index.ts
      - name: Prepare deterministic LerryShort smoke fixture
        run: |
          mkdir -p public out
          node <<'NODE'
          const fs=require('node:fs');
          const story='Riko menemukan peta di loteng. Ia mengikuti tanda menuju taman. Di bawah pohon, ia menemukan kotak kecil. Riko membuka kotak dan tersenyum.';
          const lines=['Riko menemukan peta di loteng.','Ia mengikuti tanda menuju taman.','Di bawah pohon, ia menemukan kotak kecil.','Riko membuka kotak dan tersenyum.'];
          const production={workingTitle:'Riko dan Peta Rahasia',script:story,ownerStory:story,voiceFile:'voice.wav',scenes:lines.map((line,i)=>({number:i+1,seconds:4,visual:['Riko menemukan peta di loteng','taman dengan pohon besar','jalan kota menuju pasar','ruang rumah yang hangat'][i],action:['surprised','walk','point','idle'][i],narration:line,dialogue:'',subtitle:line}))};
          fs.writeFileSync('production-smoke.json',JSON.stringify(production,null,2));
          const sampleRate=24000,seconds=16,pcm=Buffer.alloc(sampleRate*seconds*2),header=Buffer.alloc(44);
          header.write('RIFF',0);header.writeUInt32LE(36+pcm.length,4);header.write('WAVE',8);
          header.write('fmt ',12);header.writeUInt32LE(16,16);header.writeUInt16LE(1,20);header.writeUInt16LE(1,22);
          header.writeUInt32LE(sampleRate,24);header.writeUInt32LE(sampleRate*2,28);header.writeUInt16LE(2,32);header.writeUInt16LE(16,34);
          header.write('data',36);header.writeUInt32LE(pcm.length,40);
          fs.writeFileSync('public/voice.wav',Buffer.concat([header,pcm]));
          console.log('Prepared 16-second smoke fixture.');
          NODE
          cp out/tts-smoke.wav public/voice.wav
          echo 'Using the real Gemini TTS sample as the LerryShort soundtrack.'
      - name: Render five-action showcase
        run: |
          mkdir -p out
          npx remotion render src/remotion/index.ts SceneMotionShowcase out/openmontage-motion-showcase.mp4 --codec=h264 --crf=23
          npx remotion render src/remotion/index.ts LerryShort out/lerry-short-smoke.mp4 --props=production-smoke.json --codec=h264 --crf=23
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffprobe
      - name: Verify both MP4 artifacts
        run: |
          test -s out/openmontage-motion-showcase.mp4
          test -s out/lerry-short-smoke.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/openmontage-motion-showcase.mp4 > out/motion-metadata.json
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/lerry-short-smoke.mp4 > out/short-metadata.json
          node <<'NODE'
          const fs=require('node:fs');
          function verify(path,expectedDuration,needsAudio){
            const meta=JSON.parse(fs.readFileSync(path,'utf8'));
            const video=meta.streams.find(stream=>stream.codec_type==='video');
            const audio=meta.streams.find(stream=>stream.codec_type==='audio');
            if(!video||video.codec_name!=='h264')throw new Error(path+': H.264 video missing');
            if(video.width!==1080||video.height!==1920)throw new Error(path+': expected 1080x1920');
            const [num,den]=video.r_frame_rate.split('/').map(Number);
            if(num/den!==30)throw new Error(path+': expected 30 fps');
            const duration=Number(meta.format.duration);
            if(Math.abs(duration-expectedDuration)>0.2)throw new Error(path+': unexpected duration '+duration);
            if(needsAudio&&!audio)throw new Error(path+': audio stream missing');
            console.log('MP4 PASS',path,{width:video.width,height:video.height,fps:num/den,duration,audio:Boolean(audio)});
          }
          verify('out/motion-metadata.json',15,false);
          verify('out/short-metadata.json',16,true);
          NODE
          test -s out/tts-smoke.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of json out/tts-smoke.wav > out/tts-metadata.json
          node -e "const m=require('./out/tts-metadata.json'); if(!m.streams.some(s=>s.codec_name==='pcm_s16le')) throw Error('TTS WAV is not PCM audio'); if(Number(m.format.duration)<0.5) throw Error('TTS audio is too short'); console.log('LIVE TTS WAV PASS',m.format.duration+'s')"
          ffmpeg -v error -i out/tts-smoke.wav -f null -
          ffmpeg -v error -i out/openmontage-motion-showcase.mp4 -f null -
          ffmpeg -v error -i out/lerry-short-smoke.mp4 -f null -
          ffmpeg -i out/lerry-short-smoke.mp4 -af volumedetect -f null - 2> out/short-audio-level.txt
          node <<'NODE'
          const fs=require('node:fs');
          const log=fs.readFileSync('out/short-audio-level.txt','utf8');
          const match=log.match(/mean_volume:\s*(-?[0-9.]+) dB/);
          if(!match || Number(match[1]) <= -40) throw new Error('Short soundtrack is silent or too quiet.');
          console.log('NON-SILENT SHORT AUDIO PASS',match[1]+' dB');
          NODE
      - name: Upload experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: lerry-openmontage-motion-showcase
          path: |
            out/*.mp4
            out/tts-smoke.wav
          if-no-files-found: error
          retention-days: 7
