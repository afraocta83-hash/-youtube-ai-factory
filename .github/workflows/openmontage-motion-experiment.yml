name: Lerry OpenMontage Motion Experiment

on:
  push:
    branches:
      - experiment/openmontage-video-engine
    paths:
      - "src/remotion/**"
      - "app/api/**"
      - "app/studio.tsx"
      - ".github/workflows/render-short.yml"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/openmontage-motion-experiment.yml"
  workflow_dispatch:

concurrency:
  group: lerry-motion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-motion-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: |
          npm audit --audit-level=moderate
          npm ls next postcss
      - name: Check optional Groq provider configuration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          if [ -n "$GROQ_API_KEY" ] && [ -n "$OWNER_PASSWORD" ]; then
            echo "Groq provider and owner test credentials are configured (values hidden)."
          else
            echo "::warning::Groq live storyboard test is skipped; CI will use its clearly labeled offline fixture."
          fi
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Next.js application
        run: npm run build
      - name: Smoke-test QC and storyboard API (Groq live provider with offline CI fallback)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          npm start > /tmp/lerry-next.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat /tmp/lerry-next.log; exit 1; fi
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const story = 'Riko menemukan peta di loteng. Ia mengikuti tanda menuju taman. Di bawah pohon, ia menemukan kotak kecil. Riko membuka kotak dan tersenyum.';
          const scenes = ['Riko menemukan peta di loteng.','Ia mengikuti tanda menuju taman.','Di bawah pohon, ia menemukan kotak kecil.','Riko membuka kotak dan tersenyum.'].map((line,i)=>({number:i+1,seconds:4,imagePrompt:'Ilustrasi kartun 2D berwarna untuk adegan cerita nomor '+(i+1),narration:line,dialogue:'',subtitle:line}));
          const base = {story,script:story,ownerStory:story,scenes,title:'Riko dan Peta Rahasia',description:'Uji pipeline Lerry Animasi.',factCheckNotes:['Cerita fiksi untuk smoke test.']};
          async function qc(payload) { const response=await fetch('http://127.0.0.1:3000/api/quality-check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}); assert.equal(response.status,200); return response.json(); }
          (async()=>{
            const good=await qc(base); assert.equal(good.passed,true); assert.equal(good.checks.sceneCount,4);
            assert.equal((await qc({...base,story:'Terlalu pendek.'})).passed,false);
            assert.equal((await qc({...base,scenes:base.scenes.map((s,i)=>i===0?{...s,seconds:40}:s)})).passed,false);
            assert.equal((await qc({...base,scenes:base.scenes.map((s,i)=>i===0?{...s,narration:'',dialogue:''}:s)})).passed,false);
            const idea='Gimana mobil bisa berjalan? Jelaskan dengan animasi yang seru dan mudah dipahami anak-anak.';
            let response,generated,cookie='';
            const live=Boolean(process.env.GROQ_API_KEY&&process.env.OWNER_PASSWORD);
            if(live){
              const login=await fetch('http://127.0.0.1:3000/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:process.env.OWNER_PASSWORD})});
              assert.equal(login.status,200); cookie=(login.headers.get('set-cookie')||'').split(';')[0]; assert.ok(cookie.startsWith('lerry_owner_session='));
            }else{
              const unauth=await fetch('http://127.0.0.1:3000/api/produce',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idea})});
              assert.equal(unauth.status,401);
            }
            if(live){
              for(let i=0;i<3;i++){response=await fetch('http://127.0.0.1:3000/api/produce',{method:'POST',headers:{'content-type':'application/json','cookie':cookie},body:JSON.stringify({idea})});generated=await response.json();if(response.status===200||(response.status!==429&&response.status<500))break;if(i<2)await new Promise(r=>setTimeout(r,3000*(i+1)));}
            }else{response={status:503};generated={error:'Groq API key and owner test password are not configured in GitHub Actions.'};}
            let production;
            if(response.status===200){
              production=generated.production; assert.equal(production.idea,idea); assert.ok(typeof production.story==='string'&&production.story.trim().length>=80);
              assert.ok(production.scenes.length>=4&&production.scenes.length<=6);
              const total=production.scenes.reduce((sum,x)=>sum+Number(x.seconds),0); assert.ok(total>=15&&total<=60);
              for(const [i,x] of production.scenes.entries()){assert.ok(String(x.narration||x.dialogue||'').trim(),'Scene '+(i+1)+' narration/dialogue required');assert.ok(String(x.imagePrompt||'').trim().length>=25);}
              console.log('LIVE IDEA-TO-STORY API PASS',{model:generated.model,scenes:production.scenes.length,durationSeconds:total});
            }else if([429,502,503].includes(response.status)){
              console.warn('LIVE GROQ UNAVAILABLE; renderer-only fixture used:',response.status,generated.error||'provider unavailable');
              production={idea,story,workingTitle:'Riko dan Peta Rahasia',title:'Riko dan Peta Rahasia',description:'Fixture offline CI.',script:story,ownerStory:story,factCheckNotes:['Fixture fiksi CI; bukan hasil AI.'],scenes:scenes.map((x,i)=>({...x,visual:x.narration,imagePrompt:'Ilustrasi kartun 2D berwarna untuk '+x.narration,action:['walk','walk','point','surprised'][i]}))};
            }else throw new Error('Idea-to-story API HTTP '+response.status+': '+JSON.stringify(generated));
            production.script=production.story||production.script; production.ownerStory=production.script; production.voiceFile='voice.wav';
            fs.writeFileSync('production-smoke.json',JSON.stringify(production,null,2));
            console.log('IDEA-TO-STORY QC PASS: valid package accepted; short story, invalid duration and missing narration rejected.');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Generate deterministic local audio fixture (CI only)
        run: |
          mkdir -p out
          node <<'NODE'
          const fs=require('node:fs');
          const rate=24000, seconds=8, samples=rate*seconds;
          const data=Buffer.alloc(samples*2);
          for(let i=0;i<samples;i++){
            const envelope=Math.min(1,i/1200,(samples-i)/1200);
            const value=Math.sin(2*Math.PI*440*i/rate)*0.16*envelope;
            data.writeInt16LE(Math.max(-32768,Math.min(32767,Math.round(value*32767))),i*2);
          }
          const header=Buffer.alloc(44);
          header.write('RIFF',0);header.writeUInt32LE(36+data.length,4);header.write('WAVE',8);
          header.write('fmt ',12);header.writeUInt32LE(16,16);header.writeUInt16LE(1,20);
          header.writeUInt16LE(1,22);header.writeUInt32LE(rate,24);header.writeUInt32LE(rate*2,28);
          header.writeUInt16LE(2,32);header.writeUInt16LE(16,34);header.write('data',36);header.writeUInt32LE(data.length,40);
          fs.writeFileSync('out/tts-smoke.wav',Buffer.concat([header,data]));
          console.log('LOCAL AUDIO FIXTURE READY (CI renderer test only; not production narration).');
          NODE
      - name: Verify Remotion compositions
        run: npx remotion compositions src/remotion/index.ts
      - name: Attach deterministic CI audio fixture to renderer smoke test
        run: |
          test -s production-smoke.json
          test -s out/tts-smoke.wav
          mkdir -p public
          cp out/tts-smoke.wav public/voice.wav
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('production-smoke.json','utf8'));
          const wav=fs.readFileSync('out/tts-smoke.wav');
          if(wav.toString('ascii',0,4)!=='RIFF'||wav.toString('ascii',8,12)!=='WAVE') throw new Error('TTS output is not WAV.');
          const duration=(wav.length-44)/(wav.readUInt32LE(24)*wav.readUInt16LE(22));
          p.scenes[0].voiceFile='voice.wav';
          p.scenes[0].voiceDurationSeconds=duration;
          fs.writeFileSync('production-smoke.json',JSON.stringify(p,null,2));
          console.log('Attached real smoke narration to first scene',{duration});
          NODE
          echo "Using the validated production package and deterministic CI audio fixture; live TTS is covered by the dedicated Edge/Piper test."
      - name: Render five-action showcase
        run: |
          mkdir -p out
          npx remotion render src/remotion/index.ts SceneMotionShowcase out/openmontage-motion-showcase.mp4 --codec=h264 --crf=23
          npx remotion render src/remotion/index.ts LerryShort out/lerry-short-smoke.mp4 --props=production-smoke.json --codec=h264 --crf=23
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffprobe
      - name: Verify both MP4 artifacts
        run: |
          test -s out/openmontage-motion-showcase.mp4
          test -s out/lerry-short-smoke.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/openmontage-motion-showcase.mp4 > out/motion-metadata.json
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/lerry-short-smoke.mp4 > out/short-metadata.json
          node <<'NODE'
          const fs=require('node:fs');
          function verify(path,expectedDuration,needsAudio){
            const meta=JSON.parse(fs.readFileSync(path,'utf8'));
            const video=meta.streams.find(stream=>stream.codec_type==='video');
            const audio=meta.streams.find(stream=>stream.codec_type==='audio');
            if(!video||video.codec_name!=='h264')throw new Error(path+': H.264 video missing');
            if(video.width!==1080||video.height!==1920)throw new Error(path+': expected 1080x1920');
            const [num,den]=video.r_frame_rate.split('/').map(Number);
            if(num/den!==30)throw new Error(path+': expected 30 fps');
            const duration=Number(meta.format.duration);
            if(Math.abs(duration-expectedDuration)>0.2)throw new Error(path+': unexpected duration '+duration);
            if(needsAudio&&!audio)throw new Error(path+': audio stream missing');
            console.log('MP4 PASS',path,{width:video.width,height:video.height,fps:num/den,duration,audio:Boolean(audio)});
          }
          verify('out/motion-metadata.json',15,false);
          const production=JSON.parse(fs.readFileSync('production-smoke.json','utf8'));
          const expectedShortDuration=production.scenes.reduce((sum,scene)=>sum+Number(scene.seconds),0);
          verify('out/short-metadata.json',expectedShortDuration,true);
          NODE
          test -s out/tts-smoke.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of json out/tts-smoke.wav > out/tts-metadata.json
          node -e "const m=require('./out/tts-metadata.json'); if(!m.streams.some(s=>s.codec_name==='pcm_s16le')) throw Error('TTS WAV is not PCM audio'); if(Number(m.format.duration)<0.5) throw Error('TTS audio is too short'); console.log('LIVE TTS WAV PASS',m.format.duration+'s')"
          ffmpeg -v error -i out/tts-smoke.wav -f null -
          ffmpeg -v error -i out/openmontage-motion-showcase.mp4 -f null -
          ffmpeg -v error -i out/lerry-short-smoke.mp4 -f null -
          ffmpeg -i out/lerry-short-smoke.mp4 -af volumedetect -f null - 2> out/short-audio-level.txt
          node <<'NODE'
          const fs=require('node:fs');
          const log=fs.readFileSync('out/short-audio-level.txt','utf8');
          const match=log.match(/mean_volume:\s*(-?[0-9.]+) dB/);
          if(!match || Number(match[1]) <= -40) throw new Error('Short soundtrack is silent or too quiet.');
          console.log('NON-SILENT SHORT AUDIO PASS',match[1]+' dB');
          NODE
      - name: Upload experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: lerry-openmontage-motion-showcase
          path: |
            out/*.mp4
            out/tts-smoke.wav
          if-no-files-found: error
          retention-days: 7
