name: Lerry Shorts Build Check
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/remotion/**"
      - "package.json"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
