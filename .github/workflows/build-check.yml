name: Lerry Shorts Build Check
on:
  push:
    branches:
      - main
      - experiment/openmontage-video-engine
      - fix/lerry-end-to-end-production
    paths:
      - "app/**"
      - "lib/**"
      - "src/remotion/**"
      - "scripts/**"
      - "services/**"
      - "promptfooconfig.yaml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for media smoke test
        run: |
          # The hosted Ubuntu image may ship a Microsoft apt source that returns 403.
          # FFmpeg comes from Ubuntu; remove only that unreachable source before updating apt.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q "packages.microsoft.com" "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Python service syntax check
        run: python -m compileall -q services/master services/worker
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Evaluate storyboard agent with Promptfoo (optional, one Groq request)
        if: ${{ env.GROQ_API_KEY != '' }}
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "true"
        run: npx --yes promptfoo@latest eval -c promptfooconfig.yaml --no-cache --no-progress-bar
      - name: Render local Remotion MP4 smoke test
        run: |
          mkdir -p out
          mkdir -p public
          ffmpeg -y -v error -f lavfi -i "sine=frequency=440:duration=20" -ar 24000 -ac 1 public/smoke.wav
          cat > /tmp/lerry-smoke-props.json <<'JSON'
          {
            "workingTitle": "Lerry Render Test",
            "scenes": [
              {"number":1,"seconds":5,"visual":"Pembukaan ceria","narration":"Tes satu","subtitle":"Tes satu","action":"walk","voiceFile":"smoke.wav","voiceDurationSeconds":5},
              {"number":2,"seconds":5,"visual":"Adegan penjelasan","narration":"Tes dua","subtitle":"Tes dua","action":"point","voiceFile":"smoke.wav","voiceDurationSeconds":5},
              {"number":3,"seconds":5,"visual":"Adegan kejutan","narration":"Tes tiga","subtitle":"Tes tiga","action":"surprised","voiceFile":"smoke.wav","voiceDurationSeconds":5},
              {"number":4,"seconds":5,"visual":"Penutup","narration":"Tes selesai","subtitle":"Tes selesai","action":"idle","voiceFile":"smoke.wav","voiceDurationSeconds":5}
            ]
          }
          JSON
          npx remotion render src/remotion/index.ts LerryShort out/lerry-smoke.mp4 --codec=h264 --crf=24 --props=/tmp/lerry-smoke-props.json
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/lerry-smoke.mp4 > /tmp/lerry-smoke-meta.json
          node -e 'const m=require("/tmp/lerry-smoke-meta.json");const v=m.streams.find(x=>x.codec_type==="video");const a=m.streams.find(x=>x.codec_type==="audio");if(!v||v.codec_name!=="h264"||v.width!==1080||v.height!==1920||v.r_frame_rate!=="30/1"||!a)process.exit(1);if(Number(m.format.duration)<19)process.exit(1);console.log("REMOTION_MP4_AUDIO_SMOKE_PASS",m.format.duration)'
          ffmpeg -v error -i out/lerry-smoke.mp4 -f null -
      - name: Upload verified MP4 smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: lerry-verified-mp4-smoke
          path: out/lerry-smoke.mp4
          if-no-files-found: error
          retention-days: 3
